name: Build VOT Universal HTML5

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - fix/universal-html5-language-captions
    paths:
      - "src/**"
      - "vite/**"
      - "package.json"
      - "bun.lock"
      - "tests/universalHtml5.test.ts"
      - ".github/workflows/universal-html5-build.yml"
  pull_request:
    branches: [master]

jobs:
  userscript:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run check
      - name: Test universal source resolver
        run: bun test tests/universalHtml5.test.ts
      - name: Build Tampermonkey userscript
        run: bun run build:gm:default
      - uses: actions/upload-artifact@v4
        with:
          name: vot-universal-html5-userscript
          path: dist/vot.user.js
          if-no-files-found: error
      - name: Publish preview userscript for direct installation and updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view universal-html5-preview >/dev/null 2>&1 || \
            gh release create universal-html5-preview --prerelease \
              --title "VOT Universal HTML5 (experimental)" \
              --notes "Experimental translation of additional HTML5 players. See UNIVERSAL_HTML5.md for limitations."
          gh release upload universal-html5-preview dist/vot.user.js --clobber
