name: Build VOT Universal HTML5

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/universal-html5-android
    paths:
      - "src/**"
      - "vite/**"
      - "package.json"
      - "bun.lock"
      - "tests/universalHtml5.test.ts"
      - ".github/workflows/universal-html5-build.yml"
  pull_request:
    branches: [master]

jobs:
  userscript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run check
      - name: Test universal source resolver
        run: bun test tests/universalHtml5.test.ts
      - name: Build Tampermonkey userscript
        run: bun run build:gm:default
      - uses: actions/upload-artifact@v4
        with:
          name: vot-universal-html5-userscript
          path: dist/vot.user.js
          if-no-files-found: error
